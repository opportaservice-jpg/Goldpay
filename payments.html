<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Goldpay — Paiements</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #111827;
        }

        .header {
            height: 64px;
            background: #111827;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .brand {
            font-size: 21px;
            font-weight: 700;
        }

        .logout {
            border: 1px solid #374151;
            background: transparent;
            color: white;
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        .container {
            max-width: 1250px;
            margin: 0 auto;
            padding: 28px 20px 50px;
        }

        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 22px;
        }

        h1 {
            font-size: 28px;
        }

        .refresh {
            border: 0;
            background: #111827;
            color: white;
            padding: 11px 17px;
            border-radius: 8px;
            cursor: pointer;
        }

        .filters {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        select {
            min-width: 170px;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: white;
            font-size: 14px;
        }

        .payments {
            display: grid;
            gap: 12px;
        }

        .payment {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 18px;
        }

        .payment-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: flex-start;
        }

        .amount {
            font-size: 21px;
            font-weight: 700;
        }

        .date {
            color: #6b7280;
            font-size: 13px;
            margin-top: 5px;
        }

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .status.pending {
            background: #fff7ed;
            color: #c2410c;
        }

        .status.confirmed {
            background: #ecfdf5;
            color: #047857;
        }

        .status.failed,
        .status.cancelled {
            background: #fef2f2;
            color: #b91c1c;
        }

        .status.reversed {
            background: #f3f4f6;
            color: #374151;
        }

        .details {
            margin-top: 17px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        .detail-label {
            color: #6b7280;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 14px;
            font-weight: 600;
            word-break: break-word;
        }

        .empty,
        .error {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 45px 20px;
            text-align: center;
            color: #6b7280;
        }

        .error {
            color: #b91c1c;
        }

        .retry {
            margin-top: 15px;
            border: 0;
            background: #111827;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }

        .pagination button {
            border: 1px solid #d1d5db;
            background: white;
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        .pagination button:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        .page-info {
            color: #6b7280;
            font-size: 14px;
        }

        .loading {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            color: #6b7280;
        }

        @media (max-width: 800px) {
            .details {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 520px) {
            .header {
                padding: 0 15px;
            }

            .container {
                padding: 20px 12px 40px;
            }

            .top {
                align-items: flex-start;
            }

            h1 {
                font-size: 23px;
            }

            .details {
                grid-template-columns: 1fr;
            }

            select {
                width: 100%;
            }

            .payment-top {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <div class="brand">Goldpay</div>
    <button class="logout" id="logoutBtn">Déconnexion</button>
</header>

<main class="container">

    <div class="top">
        <h1>Paiements</h1>
        <button class="refresh" id="refreshBtn">Actualiser</button>
    </div>

    <div class="filters">

        <select id="countryFilter">
            <option value="">Tous les pays</option>
            <option value="BF">Burkina Faso</option>
            <option value="BJ">Benin</option>
            <option value="CI">Côte d'Ivoire</option>
            <option value="TG">Togo</option>
        </select>

        <select id="statusFilter">
            <option value="">Tous les statuts</option>
            <option value="pending">En attente</option>
            <option value="confirmed">Confirmé</option>
            <option value="failed">Échoué</option>
            <option value="cancelled">Annulé</option>
            <option value="reversed">Inversé</option>
        </select>

    </div>

    <section id="paymentsContainer">
        <div class="loading">Chargement des paiements...</div>
    </section>

    <div class="pagination" id="pagination" style="display:none;">
        <button id="prevBtn">Précédent</button>
        <span class="page-info" id="pageInfo"></span>
        <button id="nextBtn">Suivant</button>
    </div>

</main>

<script src="payments.js"></script>

</body>
                                     </html>
