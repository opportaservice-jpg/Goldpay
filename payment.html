<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<meta name="description" content="Paiement sécurisé Goldpay">
<title>Goldpay — Paiement</title>

<style>
:root{
    --bg:#f4f7fb;
    --card:#fff;
    --dark:#07111f;
    --text:#101828;
    --muted:#667085;
    --line:#e4e9f0;
    --blue:#1769ff;
    --blue-dark:#0d4fd6;
    --green:#12b76a;
    --red:#f04438;
    --shadow:0 18px 50px rgba(7,17,31,.10);
    --radius:22px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,
    BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:linear-gradient(
        180deg,
        #07111f 0 220px,
        var(--bg) 220px
    );
    color:var(--text);
    min-height:100vh;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.shell{
    width:min(560px,calc(100% - 28px));
    margin:0 auto;
    padding:70px 0 40px;
}

.brand{
    color:#fff;
    text-align:center;
    margin-bottom:28px;
}

.logo{
    width:54px;
    height:54px;
    border-radius:17px;
    display:grid;
    place-items:center;
    margin:0 auto 12px;
    background:linear-gradient(135deg,#1769ff,#5c9aff);
    font-size:25px;
    font-weight:900;
    box-shadow:0 12px 30px rgba(23,105,255,.25);
}

.brand h1{
    font-size:25px;
    letter-spacing:-.5px;
}

.brand p{
    margin-top:5px;
    color:#aab4c4;
    font-size:12px;
}

.card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
}

.body{
    padding:26px;
}

.merchant{
    padding-bottom:20px;
    border-bottom:1px solid var(--line);
}

.merchant-name{
    font-size:21px;
    font-weight:900;
}

.description{
    margin-top:7px;
    color:var(--muted);
    font-size:13px;
    line-height:1.55;
}

.field{
    margin-top:20px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#344054;
    font-size:12px;
    font-weight:850;
}

select,
input{
    width:100%;
    padding:14px;
    border:1px solid #d8dee8;
    border-radius:13px;
    background:#fff;
    outline:none;
    color:var(--text);
}

select:focus,
input:focus{
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(23,105,255,.10);
}

.amount-box{
    display:flex;
    align-items:center;
    gap:10px;
}

.amount-box input{
    font-size:18px;
    font-weight:850;
}

.currency{
    color:#667085;
    font-size:13px;
    font-weight:900;
}

.fixed{
    padding:15px;
    border:1px solid #d8dee8;
    border-radius:13px;
    font-size:20px;
    font-weight:900;
    background:#f8fafc;
}

.hint{
    margin-top:7px;
    color:#98a2b3;
    font-size:11px;
    line-height:1.45;
}

.btn{
    width:100%;
    margin-top:23px;
    border:0;
    border-radius:13px;
    padding:15px;
    color:#fff;
    background:var(--blue);
    font-size:14px;
    font-weight:900;
    box-shadow:0 10px 24px rgba(23,105,255,.20);
}

.btn:hover{
    background:var(--blue-dark);
}

.btn:disabled{
    opacity:.65;
    cursor:not-allowed;
}

.message{
    display:none;
    margin-top:15px;
    padding:12px 14px;
    border-radius:12px;
    font-size:12px;
    font-weight:750;
    line-height:1.45;
}

.message.show{
    display:block;
}

.message.error{
    background:#fef3f2;
    color:#b42318;
}

.message.success{
    background:#ecfdf3;
    color:#067647;
}

.loading{
    text-align:center;
    padding:30px;
    color:var(--muted);
    font-size:13px;
}

.footer{
    text-align:center;
    margin-top:18px;
    color:#98a2b3;
    font-size:10px;
}

.hidden{
    display:none!important;
}

@media(max-width:550px){

    .shell{
        padding-top:45px;
    }

    body{
        background:linear-gradient(
            180deg,
            #07111f 0 185px,
            var(--bg) 185px
        );
    }

    .body{
        padding:20px;
    }
}
</style>
</head>

<body>

<div class="shell">

    <div class="brand">

        <div class="logo">
            G
        </div>

        <h1>
            Goldpay
        </h1>

        <p>
            Paiement sécurisé
        </p>

    </div>


    <section class="card">

        <div
            id="loading"
            class="loading"
        >
            Chargement du lien de paiement…
        </div>


        <div
            id="content"
            class="body hidden"
        >

            <div class="merchant">

                <div
                    id="linkName"
                    class="merchant-name"
                >
                    Paiement
                </div>

                <div
                    id="description"
                    class="description hidden"
                ></div>

            </div>


            <div class="field">

                <label for="country">
                    Pays de paiement
                </label>

                <select id="country"></select>

            </div>


            <div
                id="amountField"
                class="field"
            >

                <label for="amount">
                    Montant
                </label>


                <div
                    id="fixedAmount"
                    class="fixed hidden"
                ></div>


                <div
                    id="freeAmount"
                    class="amount-box"
                >

                    <input
                        id="amount"
                        type="number"
                        min="500"
                        step="1"
                        inputmode="numeric"
                        placeholder="Ex. 5000"
                    >

                    <span class="currency">
                        XOF
                    </span>

                </div>


                <div class="hint">
                    Montant minimum : 500 XOF.
                </div>

            </div>


            <button
                id="payBtn"
                class="btn"
                type="button"
            >
                Continuer vers le paiement
            </button>


            <div
                id="message"
                class="message"
                role="alert"
            ></div>

        </div>

    </section>


    <div class="footer">
        Paiement traité par WestPay · Goldpay
    </div>

</div>


<script>

const API =
    "https://autcbkafczthxcyjkobf.supabase.co/functions/v1/public-payment-link";


const state = {

    token:"",
    link:null,
    merchant:null,
    countries:[]

};


const $ = (id) =>
    document.getElementById(id);


function showMessage(text,type="error"){

    const el = $("message");

    el.textContent = text;

    el.className =
        "message show " + type;

}


function clearMessage(){

    $("message").className = "message";

    $("message").textContent = "";

}


function countryLabel(code){

    const labels = {

        BF:"🇧🇫 Burkina Faso",
        BJ:"🇧🇯 Bénin",
        CI:"🇨🇮 Côte d’Ivoire",
        TG:"🇹🇬 Togo"

    };

    return labels[code] || code;

}


function render(){

    const link = state.link;


    $("linkName").textContent =
        link.name || "Paiement";


    if(link.description){

        $("description").textContent =
            link.description;

        $("description").classList.remove(
            "hidden"
        );

    }


    const select = $("country");

    select.innerHTML = "";


    state.countries.forEach(code => {

        const option =
            document.createElement("option");

        option.value = code;

        option.textContent =
            countryLabel(code);

        select.appendChild(option);

    });


    if(link.amount_type === "fixed"){

        $("fixedAmount").textContent =
            Number(link.fixed_amount)
            .toLocaleString("fr-FR")
            + " XOF";

        $("fixedAmount")
            .classList
            .remove("hidden");

        $("freeAmount")
            .classList
            .add("hidden");

    }else{

        $("fixedAmount")
            .classList
            .add("hidden");

        $("freeAmount")
            .classList
            .remove("hidden");

    }


    $("loading")
        .classList
        .add("hidden");

    $("content")
        .classList
        .remove("hidden");

}


async function loadPaymentLink(){

    const params =
        new URLSearchParams(
            window.location.search
        );


    state.token =
        (params.get("token") || "").trim();


    if(!state.token){

        $("loading")
            .classList
            .add("hidden");

        $("content")
            .classList
            .remove("hidden");

        showMessage(
            "Lien de paiement invalide : token manquant."
        );

        $("payBtn").disabled = true;

        return;

    }


    try{

        const response =
            await fetch(API,{

                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({
                    token:state.token
                })

            });


        const data =
            await response
                .json()
                .catch(() => ({}));


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.error ||
                "Impossible de charger le lien de paiement."
            );

        }


        state.link =
            data.link;

        state.merchant =
            data.merchant;

        state.countries =
            Array.isArray(
                data.link.country_codes
            )
            ? data.link.country_codes
            : [];


        if(!state.countries.length){

            throw new Error(
                "Aucun pays n'est configuré pour ce lien."
            );

        }


        render();


    }catch(error){

        $("loading")
            .classList
            .add("hidden");

        $("content")
            .classList
            .remove("hidden");


        showMessage(
            error.message ||
            "Erreur lors du chargement du paiement."
        );


        $("payBtn").disabled = true;

    }

}


async function startPayment(){

    clearMessage();


    const countryCode =
        $("country").value;


    if(!countryCode){

        showMessage(
            "Sélectionnez un pays."
        );

        return;

    }


    let amount;


    if(
        state.link.amount_type ===
        "fixed"
    ){

        amount =
            Number(
                state.link.fixed_amount
            );

    }else{

        amount =
            Number(
                $("amount").value
            );

    }


    if(
        !Number.isSafeInteger(amount) ||
        amount < 500
    ){

        showMessage(
            "Le montant doit être un nombre entier d'au moins 500 XOF."
        );

        return;

    }


    const button =
        $("payBtn");


    button.disabled = true;

    button.textContent =
        "Préparation du paiement…";


    try{

        /*
         * La fonction Supabase EXISTANTE
         * public-payment-link vérifie :
         *
         * - le token
         * - le lien
         * - le marchand
         * - les pays autorisés
         * - le montant
         *
         * Puis elle génère l'URL WestPay.
         *
         * Aucune clé API WestPay n'est
         * exposée dans cette page.
         */


        const response =
            await fetch(API,{

                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({

                    token:state.token,

                    country_code:
                        countryCode,

                    amount:amount

                })

            });


        const data =
            await response
                .json()
                .catch(() => ({}));


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.error ||
                "Impossible de préparer le paiement."
            );

        }


        const url =
            data.checkout &&
            (
                data.checkout
                    .recommended_url ||

                data.checkout
                    .bank1_url
            );


        if(!url){

            throw new Error(
                "URL WestPay indisponible."
            );

        }


        /*
         * Redirection vers WestPay.
         *
         * WestPay prend ensuite en charge :
         * - l'opérateur
         * - le numéro
         * - le parcours de paiement
         * - l'OTP si nécessaire
         */

        window.location.href = url;


    }catch(error){

        showMessage(
            error.message ||
            "Erreur lors de la préparation du paiement."
        );


        button.disabled = false;

        button.textContent =
            "Continuer vers le paiement";

    }

}


$("payBtn")
    .addEventListener(
        "click",
        startPayment
    );


loadPaymentLink();

</script>

</body>
  </html>
